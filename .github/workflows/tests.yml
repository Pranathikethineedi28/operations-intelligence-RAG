name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Light dependencies only: the tests use the TF-IDF retriever and a fake Claude client,
      # so CI needs no GPU, model downloads or API key.
      - run: pip install pandas numpy scikit-learn anthropic pytest
      - run: pytest -q
      - run: python -m eval.run_eval
